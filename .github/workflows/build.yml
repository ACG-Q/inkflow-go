name: Build & Release

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # Linux amd64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
            output: inkflow-linux-amd64
          # Linux arm64 (aarch64) - Raspberry Pi 4+ (64-bit), AWS Graviton, etc.
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
            output: inkflow-linux-arm64
          # Linux armv7 (32-bit) - Raspberry Pi 2/3/4, Orange Pi, etc.
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: '7'
            output: inkflow-linux-armv7
          # Linux armv6 - Raspberry Pi Zero/1
          - os: ubuntu-latest
            goos: linux
            goarch: arm
            goarm: '6'
            output: inkflow-linux-armv6
          # Linux 386 (x86 32-bit)
          - os: ubuntu-latest
            goos: linux
            goarch: '386'
            output: inkflow-linux-386
          # Windows amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
            output: inkflow-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build
        shell: bash

      - name: Generate Windows resources
        if: matrix.goos == 'windows'
        run: |
          go install github.com/tc-hib/go-winres@latest
          go-winres make

      - name: Build Go backend
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: go build -ldflags="-s -w" -o dist/${{ matrix.output }} .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/inkflow-linux-amd64/inkflow-linux-amd64
            dist/inkflow-linux-arm64/inkflow-linux-arm64
            dist/inkflow-linux-armv7/inkflow-linux-armv7
            dist/inkflow-linux-armv6/inkflow-linux-armv6
            dist/inkflow-linux-386/inkflow-linux-386
            dist/inkflow-windows-amd64.exe/inkflow-windows-amd64.exe
